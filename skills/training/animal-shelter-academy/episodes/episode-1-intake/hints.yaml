guided:
  - >
    Think about what the shelter needs before it can safely accept
    responsibility for the animal.

  - >
    Is there a moment when the animal officially becomes part of the
    shelter's care?

  - >
    What information would staff likely record during intake?

  - >
    Was there a form or artifact involved in capturing that information?

  - >
    Who is responsible for documenting the arrival?

  - >
    Which event tells you that the intake process is complete?

  - >
    Are all collected details equally important, or are some required
    while others are optional?

practice:
  - >
    Explore the sequence of actions that occurs before intake is finalized.

  - >
    Consider which operational roles participate in the process.

  - >
    Ask yourself what information must be available before responsibility
    can transfer to the shelter.

  - >
    If an important decision is made, what information might support it?

